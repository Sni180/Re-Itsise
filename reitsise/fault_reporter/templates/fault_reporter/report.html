{% extends 'base.html' %} {% block content %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<div id="successModal" class="modal-overlay" style="display: none">
  <div class="modal-content">
    <div style="font-size: 50px; margin-bottom: 15px">✅</div>
    <h3 style="color: #0f172a">Successfully Reported!</h3>
    <p style="color: #64748b">
      Your report has been logged. <br />
      <strong>Reference number sent to phone.</strong>
    </p>
    <button
      onclick="closeModal()"
      class="submit-btn"
      style="margin-top: 10px; width: auto; padding: 10px 30px"
    >
      Done
    </button>
  </div>
</div>

<div class="card" style="max-width: 800px; margin: auto; padding: 30px">
  <h2>Log a new Fault Report</h2>
  <p style="color: #64748b; margin-bottom: 25px">
    Provide as much detail as possible to help our technicians.(<span
      class="required-asterisk"
      >*</span
    >)
  </p>

  <form
    id="reportForm"
    method="post"
    enctype="multipart/form-data"
    onsubmit="handleFormSubmit(event)"
  >
    {% csrf_token %}

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      "
    >
      <div>
        <label>Full Name</label> <span class="required-asterisk">*</span>
        <input
          type="text"
          name="full_name"
          required
          placeholder="e.g. Thabo Mokoena"
          class="form-control"
        />
      </div>
      <div>
        <label>Cellphone Number</label> <span class="required-asterisk">*</span>
        <input
          type="tel"
          name="cellphone"
          required
          placeholder="e.g. 071 234 5678"
          class="form-control"
        />
      </div>
    </div>

    <div class="form-group">
      <label>Problem Category</label> <span class="required-asterisk">*</span>
      {{ form.category }}
    </div>

    <div class="form-group">
      <label
        >Location (Select on Map or Type Manually)
        <span class="required-asterisk">*</span></label
      >
      <div
        id="map-picker"
        style="
          height: 300px;
          border-radius: 8px;
          margin-bottom: 10px;
          border: 1px solid #cbd5e1;
        "
      ></div>
      <input
        type="text"
        name="location_address"
        id="id_address"
        required
        placeholder="Type address here or click the map above..."
        class="form-control"
      />
      <input type="hidden" name="latitude" id="id_lat" />
      <input type="hidden" name="longitude" id="id_lng" />
    </div>

    <div class="form-group">
      <label>Describe the Problem (Manual Report)</label>
      <textarea
        name="description"
        placeholder="Provide extra details..."
        class="form-control"
        style="height: 80px"
      ></textarea>
    </div>

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      "
    >
      <div
        style="
          background: #f8fafc;
          padding: 15px;
          border-radius: 8px;
          text-align: center;
        "
      >
        <label>🎙️ Voice Report</label>
        <div id="rec-controls">
          <button type="button" id="startBtn" class="btn-rec">Start</button>
          <button type="button" id="stopBtn" class="btn-stop" disabled>
            Stop
          </button>
        </div>
        <audio
          id="audioPreview"
          controls
          style="margin-top: 10px; width: 100%; display: none"
        ></audio>
        <input
          type="file"
          name="audio_report"
          id="audioFileInput"
          style="display: none"
        />
      </div>
      <div style="background: #f8fafc; padding: 15px; border-radius: 8px">
        <label>📸 Upload Photo</label>
        <input
          type="file"
          name="image"
          accept="image/*"
          style="margin-top: 10px"
        />
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      Submit Formal Report
    </button>
  </form>
</div>

<style>
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: none; /* Changed to none so it only shows on success */
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    max-width: 400px;
  }
  .form-control,
  select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }
  .required-asterisk {
    color: #ef4444;
    font-weight: bold;
  }
  .btn-rec {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
  }
  .btn-stop {
    background: #1e293b;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
  }
  .submit-btn {
    width: 100%;
    background: #0062ff;
    color: white;
    padding: 16px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // --- Map Logic ---
  var map = L.map("map-picker").setView([-28.7433, 24.7587], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  var marker;
  map.on("click", function (e) {
    if (marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map);
    document.getElementById("id_lat").value = e.latlng.lat;
    document.getElementById("id_lng").value = e.latlng.lng;
    fetch(
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${e.latlng.lat}&lon=${e.latlng.lng}`,
    )
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("id_address").value = data.display_name;
      });
  });

  // --- Voice Logic ---
  let mediaRecorder;
  let chunks = [];
  document.getElementById("startBtn").onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    document.getElementById("startBtn").disabled = true;
    document.getElementById("stopBtn").disabled = false;
    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: "audio/wav" });
      const preview = document.getElementById("audioPreview");
      preview.src = URL.createObjectURL(blob);
      preview.style.display = "block";
      const file = new File([blob], "voice.wav", { type: "audio/wav" });
      const container = new DataTransfer();
      container.items.add(file);
      document.getElementById("audioFileInput").files = container.files;
      chunks = [];
    };
  };
  document.getElementById("stopBtn").onclick = () => {
    mediaRecorder.stop();
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
  };

  // --- Submission Logic ---
  async function handleFormSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);

    try {
      const response = await fetch(window.location.href, {
        method: "POST",
        body: formData,
        headers: { "X-CSRFToken": "{{ csrf_token }}" },
      });

      if (response.ok) {
        document.getElementById("successModal").style.display = "flex";
        form.reset();
      }
    } catch (error) {
      console.error(error);
    }
  }

  // Change this function at the bottom of report_fault.html
  function closeModal() {
    document.getElementById("successModal").style.display = "none";
    // Redirect to the map page so the new report appears in the list
    window.location.href = "{% url 'explorer_map' %}";
  }
</script>
{% endblock %}
